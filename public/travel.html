        const albumLinks = document.querySelectorAll('.album-link');
        albumLinks.forEach(link => {
            link.addEventListener('click', function (event) {
                event.preventDefault(); // Ngăn chặn việc chuyển hướng trang mặc định
                const albumId = this.getAttribute('data-album-id'); // Lấy album-id từ thuộc tính data
                window.location.href = `album.html?id=${albumId}`;
            });
        });


    </script>
</head>
