<!DOCTYPE html>
<html>

<head>
    <title>Blog ThanhDuy</title>
    <link rel="icon" href="Anh/duy.jpg" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css(only)/css-amnhac.css">
</head>

<body>
    <div id="main-navbar"></div>
    <script src="js/navbar.js" defer></script>
    <link rel="stylesheet" href="./css(only)/css_nav.css">
    <main>

        <audio src=""></audio>
        <!-- Nút lên trên -->
        <button class="scroll-to-top" onclick="scrollToTop()"></button>

        <div class="artist-header">
            <img src="./Anh/astronaut.png" alt="Vũ" class="artist-avatar"
                onerror="this.src='https://via.placeholder.com/150'">
            <div class="artist-info">
                <h2>Tổng hợp nhạc tôi thích</h2>
                <p>Tuyển tập những bản tình ca hay nhất.</p>
                <button class="play-all-btn">Phát ngẫu nhiên</button>
            </div>
        </div>

        <!-- danh sách nhạc sẽ render tự động -->
        <div class="song-list-class" id="song-list"></div>

        <!-- trình phát nhạc -->
        <div class="music-list">
            <button class="button" id="button-loop" onclick="loopsong()">🔄</button>
            <audio controls id="audioPlayer">
                <source id="audioSource" src="" type="audio/mpeg">
                <source src="" type="audio/wav">
            </audio>
        </div>

    </main>

    <script>
        // Nút scroll lên đầu trang
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        window.onscroll = function () { scrollFunction(); };
        function scrollFunction() {
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                document.querySelector('.scroll-to-top').style.display = 'block';
            } else {
                document.querySelector('.scroll-to-top').style.display = 'none';
            }
        }


        // ======== PLAYLIST =========
        const songs = [
            { title: "Nothing's Gonna Change My Love For You - AI", src: "./MP3/Nothings Gonna Change My Love For You Lyrics  Justin Bieber AI Cover.mp3" },
            { title: "Tình Yêu Chậm Trễ - MONSTAR", src: "./MP3/Tình yêu chậm trễ MOON ver  MONSTAR.mp3" },
            { title: "Love Story - Taylor Swift", src: "./MP3/Love Story  Taylor Swift Lyrics  Vietsub.mp3" },
            { title: "Jax - Like My Father", src: "./MP3/Jax-Like My Father.mp3" },
            { title: "Đông Kiếm Em - Vũ", src: "./MP3/ĐÔNG KIẾM EM  Vũ Original.mp3" },
            { title: "Stephanie Poetri - I Love You 3000", src: "./MP3/ILOVEYOU3000.mp3" },
            { title: "Sơn Tùng - Hạnh Phúc Mới", src: "./MP3/Hạnh Phúc Mới.mp3" },
            { title: "My Everything - Tiên Tiên", src: "./MP3/MY EVERYTHING  TIÊN TIÊN.mp3" },
            { title: "Thêm Bao Nhiêu Lâu - Đạt G", src: "./MP3/Thêm Bao Nhiêu Lâu  Đạt G.mp3" },
            { title: "Lee Hi - Only", src: "./MP3/ONLY-LEEHI.mp3" },
            { title: "Lady Mây - Anh Chưa Thương Em Đến Vậy Đâu", src: "./MP3/Anh Chưa Thương Em Đến Vậy Đâu.mp3" },
            { title: "Bước Qua Nhau - Vũ", src: "./MP3/BƯỚC QUA NHAU  Vũ Official MV.mp3" },
            { title: "Anh Nhớ Ra - Vũ", src: "./MP3/Anh Nhớ Ra - Vũ.mp3" },
            { title: "Những Lời Hứa Bỏ Quên - Vũ", src: "./MP3/NHỮNG LỜI HỨA BỎ QUÊN  VŨ x DEAR JANE Official MV.mp3" },
            { title: "Photograph - Ed Sheeran", src: "./MP3/Photograph  Ed Sheeran.mp3" },
            { title: "Perfect - Ed Sheeran", src: "./MP3/Ed Sheeran  Perfect.mp3" },
            { title: "Can't take my eyes off you - Aesthetic", src: "./MP3/Cant take my eyes of you  Aesthetic Lyrics.mp3" },
            { title: "Love Yourself - Justin Bieber", src: "./MP3/Justin Bieber  Love Yourself Lyrics.mp3" },
            { title: "Flashlight - Jessie J", src: "./MP3/Flashlight  Jessie J from Pitch Perfect 2 Lyrics  Vietsub.mp3" },
            { title: "Có hẹn với Thanh Xuân - Grey D", src: "./MP3/có hẹn với thanh xuân  MONSTAR  official music video.mp3" },
            { title: "Mặt trời của em - Hương Ly ft JustaTee", src: "./MP3/Mặt Trời Của Em  Official MV  Phương Ly ft JustaTee.mp3" },
            { title: "Rung động - Duong EDWARD", src: "./MP3/RUNGDONG.mp3" },
            { title: "Vùng Ký Ức", src: "./MP3/Vùng Ký Ức.mp3" },
            { title: "Chia xa - Dương EDWARD", src: "./MP3/chiaxa.mp3" },
            { title: "Mùa mưa ngâu nằm cạnh - Vũ.", src: "./MP3/Mùa Mưa Ngâu Nằm Cạnh - Vũ..mp3" },
            { title: "3107 full album", src: "./MP3/3107 full album.mp3" },
            { title: "Lạ Lùng", src: "./MP3/Lạ Lùng.mp3" },
            { title: "Mùa mưa ngâu nằm cạnh - Vũ.", src: "./MP3/Mùa Mưa Ngâu Nằm Cạnh - Vũ..mp3" },
            { title: "3107 full album", src: "./MP3/3107 full album.mp3" },
            { title: "Lạ Lùng", src: "./MP3/Lạ Lùng.mp3" },
        ];

        let currentSong = null;
        let loop = false;
        const audioPlayer = document.getElementById("audioPlayer");
        const audioSource = document.getElementById("audioSource");
        const buttonloop = document.getElementById("button-loop");

        // render danh sách bài hát
        function renderSongList() {
            const list = document.getElementById("song-list");
            list.innerHTML = "";
            songs.forEach((song, index) => {
                const div = document.createElement("div");
                div.className = "music-div";
                div.id = "playButton" + (index + 1);
                div.textContent = `${index + 1}. ${song.title}`;
                div.onclick = () => togglePlay(index);
                list.appendChild(div);
            });
        }

        function loopsong() {
            loop = !loop;
            if (!loop) buttonloop.classList.remove("playing");
            else buttonloop.classList.add("playing");
        }

        function togglePlay(index) {
            const playButton = document.getElementById("playButton" + (index + 1));

            if (currentSong !== index) {
                if (currentSong !== null) {
                    document.getElementById("playButton" + (currentSong + 1)).classList.remove("playing");
                    audioPlayer.pause();
                }
                audioSource.src = songs[index].src;
                audioPlayer.load();
                currentSong = index;
            }

            if (audioPlayer.paused) {
                audioPlayer.play();
                playButton.classList.add("playing");
            } else {
                audioPlayer.pause();
                playButton.classList.remove("playing");
            }
        }

        audioPlayer.addEventListener("ended", function () {
            nextSong();
        });

        function nextSong() {
            let nextIndex = currentSong + 1;
            if (nextIndex >= songs.length) {
                if (!loop) {
                    location.reload();
                    return;
                } else {
                    nextIndex = 0;
                }
            }
            togglePlay(nextIndex);
        }

        renderSongList();
    </script>
</body>

</html>
